<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Notepad</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata&family=Lora&family=Roboto&display=swap" rel="stylesheet">

  <!-- Quill and Highlight.js -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/monokai-sublime.min.css">

  <!-- Application Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dark-theme.css">
</head>
<body>
  <header class="app-header">
    <div class="header-controls">
      <div class="dropdown">
        <button id="download-btn" class="dropbtn">Download</button>
        <div id="download-options" class="dropdown-content">
          <a href="#" id="download-txt">as Text (.txt)</a>
          <a href="#" id="download-html">as HTML (.html)</a>
          <a href="#" id="download-json">as JSON (.json)</a>
        </div>
      </div>
      <button id="format-json-btn">Format JSON</button>
      <button id="theme-toggle">Toggle Theme</button>
      <button id="upload-btn">Upload File</button>
      <input type="file" id="file-upload" accept=".txt" style="display: none;">
    </div>
  </header>
  <main class="main-content">
    <div id="tabs-container">
      <div id="tabs-list"></div>
      <div class="dropdown">
        <button id="new-note-btn" class="dropbtn">+</button>
        <div id="new-note-options" class="dropdown-content">
          <a href="#" data-note-type="rich-text">Rich Text Note</a>
          <a href="#" data-note-type="plain-text">Plain Text Note</a>
          <a href="#" data-note-type="bookmark">Bookmark</a>
          <a href="#" data-note-type="whiteboard">Whiteboard</a>
        </div>
      </div>
    </div>
    <div id="editor-container">
      <div id="editor"></div>
    </div>
    <div id="bookmark-container" class="custom-note-view" style="display: none;">
      <div id="bookmark-list"></div>
      <form id="add-bookmark-form">
        <input type="text" id="bookmark-title" placeholder="Title" required>
        <input type="url" id="bookmark-url" placeholder="URL" required>
        <button type="submit">Add Bookmark</button>
      </form>
    </div>
    <div id="whiteboard-container" class="custom-note-view" style="display: none;">
      <div id="whiteboard-toolbar">
        <button id="wb-pen">Pen</button>
        <button id="wb-eraser">Eraser</button>
        <input type="color" id="wb-color" value="#000000">
        <button id="wb-clear">Clear</button>
      </div>
      <canvas id="whiteboard-canvas"></canvas>
    </div>
  </main>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

  <!-- Main Application Script -->
  <script src="script.js"></script>
</body>
</html>
